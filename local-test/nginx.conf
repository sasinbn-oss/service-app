# ทางเข้าเดียวของระบบทดสอบ (พอร์ต 8080 บนคอม) — หน้าเว็บ · API · ไฟล์รูป อยู่หลังที่อยู่เดียวกัน
# เปิดจากมือถือในวง Wi-Fi ด้วย IP ของคอมได้ทันที ไม่ต้องตั้งค่าตาม IP
server {
  listen 80;
  # วิดีโอเคลม/ไฟล์สำรองใหญ่ได้ — ค่าตั้งต้นของ nginx (1 MB) ตัดอัปโหลดทิ้ง
  client_max_body_size 200m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }
  location /health {
    proxy_pass http://backend:4000;
  }
  # ลิงก์รูป/ไฟล์แบบ /<ชื่อถัง>/... (STORAGE_BROWSER_RELATIVE=1 ใน backend)
  location /service-app/ {
    proxy_pass http://storage:9000;
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri.html $uri/ /index.html;
  }
}
